[package]
name = "kitty-claude-notifier"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
nix = { version = "0.31.3", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "process", "sync", "time"] }
toml = "1.1.4"
