[package]
name = "kitty-claude-notifier"
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/gbcreation/kitty-claude-notifier"
description = "Reactive Kitty terminal tab indicators for Claude Code"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
fd-lock = "4.0.4"
nix = { version = "0.31.3", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "process", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "test-util"] }
