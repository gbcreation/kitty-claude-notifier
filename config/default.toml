# kitty-claude-notifier configuration
# Copied to ~/.config/kitty-claude-notifier/config.toml on install.
# Any field left out here falls back to the built-in default.
#
# Top-level (non-table) keys must stay above the [icons]/[colors] table
# headers below — TOML assigns any key after a [table] header to that
# table, not to the document root.

# Seconds before done/waiting -> idle.
idle_timeout_secs = 300

# How often the resume-detection screen-scrape polls `kitten @ get-text`
# while a session is stuck in permission/waiting (milliseconds).
resume_poll_interval_ms = 500

# Text markers (case-insensitive substring match) that indicate a
# permission prompt is still visible on screen. Update this list if
# Claude Code's prompt wording changes across versions.
permission_markers = [
    "do you want to proceed?",
    "❯ 1. yes",
]

# Per-state icon overrides: a glyph prepended to the tab's *existing*
# title (whatever the shell already set it to), rendered in the given
# color. Must be a plain Unicode symbol or Nerd Font glyph — emoji carry
# their own embedded color and ignore the `color` setting entirely.
#
# Colors default to white rather than matching the tab-background color
# below — an icon the same color as its own background disappears.
#
# Add a `text` key to prepend the icon onto fixed text instead of the
# tab's live title (the old per-state custom-title behavior, now
# combined with the icon rather than replacing it), e.g.:
#
#   [icons.permission]
#   glyph = "▲"
#   color = "#ffffff"
#   text = "NEEDS APPROVAL"
[icons.working]
glyph = "●"
color = "#ffffff"

[icons.permission]
glyph = "▲"
color = "#ffffff"

[icons.waiting]
glyph = "◐"
color = "#ffffff"

[icons.done]
glyph = "✓"
color = "#ffffff"

[icons.idle]
glyph = "○"
color = "#888888"

[icons.error]
glyph = "✕"
color = "#ffffff"

# Per-state tab color overrides. A plain string applies to both the
# focused and unfocused tab background ("NONE" clears it). To use a
# different color when the tab isn't focused, use a table instead, e.g.:
#
#   [colors.permission]
#   active = "#ff003c"
#   inactive = "#7a0020"
#
# (Kitty only honors `active_bg` while a tab is focused, so without an
# inactive color a background tab wouldn't show any color at all.)
[colors]
working = "#b026ff"
permission = "#ff003c"
waiting = "#00ffd5"
done = "#00ffd5"
idle = "NONE"
error = "#ff6b00"
